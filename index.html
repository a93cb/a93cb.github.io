<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a93cb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Announcement Bar Styles */
    .announcement-bar {
      background-color: #0284c7;
      color: #ffffff;
      padding: 0.5rem 1rem;
      text-align: center;
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .announcement-bar-close {
      position: absolute;
      right: 1rem;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.25rem;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }

    .announcement-bar-close:hover {
      opacity: 1;
    }

    header {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-container {
      width: 100%;
      max-width: 320px;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .status-bar {
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .game-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }

    .game-description {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .play-btn {
      width: 100%;
      padding: 0.6rem;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .play-btn:hover {
      background-color: #0369a1;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
      grid-column: 1 / -1;
    }

    footer {
      background-color: #1e293b;
      border-top: 1px solid #334155;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: auto;
    }
  </style>
</head>

<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar" id="announcementBar">
    <span>IMPORTANT: Mute your sound before playing!</span>
  </div>

  <header>
    <div class="brand">a93cb</div>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
    </div>
  </header>

  <main>
    <div class="status-bar" id="statusBar">Loading library...</div>
    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <footer>
    <p>Disclaimer: We do not take credit for any of the games hosted on this site. All rights belong to their respective creators and owners.</p>
  </footer>

  <script>
    let gamesList = [];

    async function fetchLibrary() {
      const statusBar = document.getElementById('statusBar');
      try {
        const response = await fetch('./games.xml');
        if (!response.ok) throw new Error('Could not load games.xml');
        const xmlText = await response.text();
        parseAndRenderXML(xmlText);
      } catch (error) {
        console.error('Error loading games.xml:', error);
        statusBar.textContent = 'Failed to load games.xml library.';
      }
    }

    function parseAndRenderXML(xmlString) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
      const gameNodes = xmlDoc.getElementsByTagName('game');

      gamesList = Array.from(gameNodes).map(node => {
        return {
          id: node.getElementsByTagName('id')[0]?.textContent || 'unknown',
          title: node.getElementsByTagName('title')[0]?.textContent || 'Untitled Game',
          path: node.getElementsByTagName('path')[0]?.textContent || '/games/game.html',
          description: node.getElementsByTagName('description')[0]?.textContent || 'No description available.'
        };
      });

      // Sort alphabetically by game title (A-Z)
      gamesList.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));

      renderGames(gamesList);
    }

    function renderGames(games) {
      const grid = document.getElementById('gamesGrid');
      const statusBar = document.getElementById('statusBar');

      grid.innerHTML = '';
      statusBar.textContent = `${games.length} ${games.length === 1 ? 'game' : 'games'} available`;

      if (games.length === 0) {
        grid.innerHTML = '<div class="empty-state">No games found.</div>';
        return;
      }

      games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => launchGame(game.path, game.title);

        card.innerHTML = `
          <div>
            <div class="game-title">${escapeHTML(game.title)}</div>
            <div class="game-description">${escapeHTML(game.description)}</div>
          </div>
          <button class="play-btn">Play</button>
        `;

        grid.appendChild(card);
      });
    }

    function launchGame(path, title) {
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('Please allow popups to open games.');
        return;
      }

      win.document.title = title;

      const iframe = win.document.createElement('iframe');
      iframe.src = path;
      iframe.style.width = '100vw';
      iframe.style.height = '100vh';
      iframe.style.border = 'none';
      iframe.style.outline = 'none';
      iframe.style.position = 'fixed';
      iframe.style.top = '0';
      iframe.style.left = '0';

      win.document.body.style.margin = '0';
      win.document.body.style.padding = '0';
      win.document.body.style.backgroundColor = '#000000';
      win.document.body.appendChild(iframe);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = gamesList.filter(game =>
        game.title.toLowerCase().includes(query) ||
        game.description.toLowerCase().includes(query)
      );
      renderGames(filtered);
    });

    window.addEventListener('DOMContentLoaded', fetchLibrary);
  </script>
</body>

</html>
