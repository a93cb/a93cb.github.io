    <style>
        .before-playing {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #16181e;
        }

        .blur-background {
            background-image: url('/data/image/game/slope-game.png');
            background-repeat: no-repeat;
            position: absolute;
            background-size: cover;
            background-position: 50%;
            filter: blur(12px);
            opacity: .7;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .preload-before-playing {
            padding: 20px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            flex-direction: column;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            max-width: 800px;
            margin: 0 auto;
        }

        .image-thumbnail-playing img {
            box-shadow: 0px 2px 1px -1px rgb(0 0 0 / 20%), 0px 1px 1px 0px rgb(0 0 0 / 14%), 0px 1px 3px 0px rgb(0 0 0 / 12%);

            border-radius: 16px;
        }

        .title-game-playing span {
            min-width: 160px;
            border-radius: 40px;
            text-transform: uppercase;
            padding: 20px 40px;
            margin-top: 20px;
            cursor: pointer;
            color: #000;
            animation: crunch 600ms infinite ease;
            text-align: center;
            display: block;
            font-size: 20px;
            font-weight: bold;
            font-family: system-ui;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: inset 0 0 1px rgba(255, 255, 255, 0.21);
            background-color: #00ff4cd4;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .title-game-playing span:hover {
            background-color: #01fd04;
        }

        @keyframes crunch {
            0% {
                transform: rotate(-2deg) scale(0.98);
            }

            50% {
                transform: rotate(2deg) scale(1.02);
            }

            100% {
                transform: rotate(-2deg) scale(1);
            }
        }
    </style>

                await document.getElementById("preloading-game").remove();
            }
            document.body.append(frame_game);
